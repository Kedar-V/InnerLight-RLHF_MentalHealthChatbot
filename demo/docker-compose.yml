version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    environment:
      - DATABASE_URL=postgresql://rlhf:rlhf@db:5432/rlhf
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-2024-08-06}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db

  trainer:
    build: ./trainer
    volumes:
      - ./models:/models
    environment:
      - DATABASE_URL=postgresql://rlhf:rlhf@db:5432/rlhf
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-2024-08-06}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: rlhf
      POSTGRES_PASSWORD: rlhf
      POSTGRES_DB: rlhf
    ports:
      - "5432:5432"
